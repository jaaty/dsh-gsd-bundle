name: Feature request
description: Suggest an idea or enhancement for dsh-gsd-bundle
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe the problem you are
        trying to solve and your proposed solution so we can evaluate it.
  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What problem or pain point does this feature address?
      placeholder: It is currently hard to ...
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed solution
      description: A clear description of the feature or change you would like to see.
      placeholder: I would like the bundle to ...
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you have considered.
    validations:
      required: false
  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Confirm you have checked the following before submitting.
      options:
        - label: I have searched the existing issues and this is not a duplicate.
          required: true
        - label: I have read CONTRIBUTING.md and understand the GSD phase loop.
          required: true
