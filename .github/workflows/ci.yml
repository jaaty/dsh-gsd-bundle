name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    # The guard only runs on pull_request events: on push to main there is
    # no pull_request event context, and main is already gated by the PR guard.
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          # fetch-depth: 0 ensures both the base and head SHAs are present;
          # a shallow checkout may lack the base commit and break the range scan.
          fetch-depth: 0

      - name: Scan PR diff for new secrets
        # gitleaks runs via the official Docker image (D-05) over the PR's
        # base...head revision range. A bare revision range is required
        # (git rejects the alternate diff form). gitleaks exits non-zero
        # when a new secret is found, which fails the guard.
        run: |
          docker run -v "$PWD:/repo" zricethezav/gitleaks:latest detect \
            --source /repo \
            --log-opts="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" \
            --report-format json