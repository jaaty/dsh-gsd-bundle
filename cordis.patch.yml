# The dsh-gsd-bundle patch: Git Ship Done (opengsd-core) reimplemented as a
# DeepSeek Harness bundle. Applied after dsh-base's insert; rows here override
# base rows by id (last write wins per row), and the insert block adds the GSD
# plugin rows.
#
# A patch replaces the targeted row's whole `config`, so each overridden row
# restates every key it owns.
#
# What "replace the default agent loop plugin" means here: the mechanical turn
# machine in @deepseek-ai/dsh-agent-loop (tool scheduling, context assembly,
# session prep) stays — that is DSH's core, not opengsd-core. The GSD bundle
# replaces the agent loop's BEHAVIOUR: it overrides the agent-loop row's
# configured agents to a GSD agent, and the gsd-persona row installs opengsd's
# phase-loop mental model (Discuss -> UI -> Plan -> Execute -> Verify -> Ship)
# as the persona every session reads. The gsd_* phase tools are the loop steps.

# ── override: the agent-loop row now configures a GSD agent ──────────────────
#
# provider/model are intentionally omitted: the agent/request waterfall resolves
# them from the user's model selection (agent-default-model), so the GSD agent
# runs on whichever model the user picked. A configured startup agent named
# `gsd` is created for CLI entry points; web sessions are created on demand by
# the same factory and inherit the GSD persona + tools.
- id: agent-loop
  config:
    maxParallelToolCalls: 10
    agents:
      - id: gsd

# ── insert: the GSD phase-loop plugin rows ───────────────────────────────────
- insert:
    # The phase-loop persona + runtime-context (orients every step at STATE.md).
    # Order -100 renders it before the deployment persona slot.
    - id: gsd-persona
      name: '@dsh-gsd/bundle/persona'

    # The .planning/ artefact + STATE.md/ROADMAP.md service. Publishes the
    # `gsdState` host service consumed by every phase tool below.
    - id: gsd-state
      name: '@dsh-gsd/bundle/state'

    # Orientation/entry tools: gsd_init, gsd_status, gsd_progress, gsd_new_milestone.
    - id: gsd-core-tools
      name: '@dsh-gsd/bundle/core-tools'

    # Phase tools. Each is one loop step as a model-facing tool.
    - id: gsd-discuss
      name: '@dsh-gsd/bundle/discuss'

    # The spec-phase step: clarifies WHAT the phase delivers (a falsifiable
    # SPEC.md) before discuss handles HOW.
    - id: gsd-spec
      name: '@dsh-gsd/bundle/spec'

    - id: gsd-plan
      name: '@dsh-gsd/bundle/plan'

    # The post-planning coverage step (between plan and execute): emits a
    # REQ-ID/D-ID vs plan coverage table (COVERAGE.md) via a deterministic
    # literal-ID scan, no sub-agent. Soft gate; never blocks gsd_execute.
    - id: gsd-gap-analysis
      name: '@dsh-gsd/bundle/gap-analysis'

    - id: gsd-execute
      name: '@dsh-gsd/bundle/execute'

    # The post-execute code-review step (between execute and verify): a
    # fresh-context reviewer subagent produces REVIEW.md with severity-classified
    # findings (BLOCKER/WARNING/INFO); an optional --fix companion applies
    # findings with per-fix atomic commits into REVIEW-FIX.md. Soft gate;
    # never blocks gsd_verify.
    - id: gsd-code-review
      name: '@dsh-gsd/bundle/code-review'

    # The post-execute UI audit step (between code-review and verify): a
    # fresh-context gsd-ui-auditor subagent scores 6 pillars 1-4 each (overall
    # /24) against the UI-SPEC (or abstract 6-pillar standards) and writes
    # UI-REVIEW.md. Soft gate; never blocks gsd_verify.
    - id: gsd-ui-review
      name: '@dsh-gsd/bundle/ui-review'

    - id: gsd-verify
      name: '@dsh-gsd/bundle/verify'

    # The post-verify, pre-ship validate-phase step: a deterministic requirement→
    # test coverage scan (COVERED/PARTIAL/MISSING/Manual-Only) writes VALIDATION.md
    # for a COMPLETED phase (Plan 01). The gap-plan test-writer subagent lands in
    # Plan 02. Soft gate; never blocks gsd_ship.
    - id: gsd-validate-phase
      name: '@dsh-gsd/bundle/validate'

    # The out-of-band undo tool (/gsd-undo): reverts a phase's or plan's commits
    # via git revert with dependency checks and a dry-run-by-default confirmation
    # gate. Not a loop step.
    - id: gsd-undo
      name: '@dsh-gsd/bundle/undo'

    # The out-of-band health diagnostic (/gsd-health): inspects .planning/
    # integrity (phase/plan numbering, orphan SUMMARYs, config.json validation,
    # STATE/ROADMAP disagreement, phase-dir naming) and offers non-destructive
    # config-only repair. Deterministic pure-JS scan, no sub-agent. Not a loop step.
    - id: gsd-health
      name: '@dsh-gsd/bundle/health'

    # The milestone-close audit step (between ship and the release quick-tasks):
    # a deterministic close-gate aggregates per-phase verifications to confirm the
    # milestone met its definition of done, plus a cross-phase UAT outstanding-items
    # list, emitted as one milestone-scoped audit report. Soft gate; never blocks
    # the release. Does not advance STATE.
    - id: gsd-milestone-audit
      name: '@dsh-gsd/bundle/milestone-audit'

    # The extract-learnings advisory step (after milestone-audit): accumulates
    # decisions, lessons, patterns, and surprises from a completed phase's
    # artefacts into a carrying-forward .planning/LEARNINGS.md. Soft gate;
    # never blocks ship. Does not advance STATE.
    - id: gsd-learnings
      name: '@dsh-gsd/bundle/learnings'

    # The graphify advisory step (after learnings): builds a project knowledge
    # graph in .planning/graphs/ from a deterministic pure-JS scan. Soft gate;
    # never blocks ship. Does not advance STATE.
    - id: gsd-graphify
      name: '@dsh-gsd/bundle/graphify'

    # The mempalace advisory step (after graphify): deliberate recall before
    # discuss/plan (MEMORY-RECALL.md) and verbatim capture at phase boundaries,
    # talking to the MemPalace CLI through an injectable exec seam. Opt-in via
    # mempalace.enabled (default false). Soft gate; never blocks a loop step.
    # Does not advance STATE.
    - id: gsd-mempalace
      name: '@dsh-gsd/bundle/mempalace'

    # The autonomous out-of-band orchestrator (/gsd-autonomous): drives every
    # remaining incomplete phase of the active milestone end-to-end (discuss /
    # plan / execute / verify per phase) without per-phase manual prompting.
    # Stops on a hard failure; never ships and never runs milestone lifecycle.
    # Not a loop step; it orchestrates the loop.
    - id: gsd-autonomous
      name: '@dsh-gsd/bundle/autonomous'

    - id: gsd-ship
      name: '@dsh-gsd/bundle/ship'

    # Optional UI design phase (below the loop threshold by default; enable per
    # phase via gsd_ui_phase).
    - id: gsd-ui
      name: '@dsh-gsd/bundle/ui'

    # The sub-threshold lightweight path (/gsd-quick in opengsd-core): for work
    # too small to warrant the full loop.
    - id: gsd-quick
      name: '@dsh-gsd/bundle/quick'

    # The brownfield codebase mapper (/gsd-map-codebase in opengsd-core):
    # parallel fresh-context mapper subagents write 7 structured documents
    # directly to .planning/codebase/. Pre-init onboarding tool; does not
    # require a GSD project. Consumed by /gsd-plan-phase.
    - id: gsd-map-codebase
      name: '@dsh-gsd/bundle/map-codebase'

    # The /gsd-* slash-command layer: thin routers that inject a user message
    # instructing the agent to run the matching gsd_* tool. Gives the opengsd
    # UX (/gsd-plan-phase 1, /gsd-ship 1, ...) alongside natural-language driving.
    # Only needs the host `commands` service.
    - id: gsd-commands
      name: '@dsh-gsd/bundle/commands'